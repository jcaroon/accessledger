name: Build and verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: dotnet test tests/AccessLedger.Tests.csproj -c Release --logger 'trx;LogFileName=tests.trx'
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm test
        working-directory: web
      - run: dotnet publish server/AccessLedger.Api.csproj -c Release -o artifacts/app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/TestResults/*.trx
