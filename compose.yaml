services:
  accessledger:
    build: .
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      # Local HTTP only. A public deployment must use Production behind HTTPS.
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - accessledger-data:/data
    restart: unless-stopped
volumes:
  accessledger-data:
